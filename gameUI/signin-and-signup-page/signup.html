

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | GameForge</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <a href="../index.html">
      <div class="logo">
        <i class="fa-solid fa-gamepad logo-icon"></i>
        <h2>Game<span>Forge</span></h2>
      </div>
    </a>

    <p>Join GameForge to save your scores and climb the leaderboard.</p>

    <form id="signUpForm">
      <input
        type="text"
        id="signUpName"
        placeholder="Username"
        autocomplete="username"
        required
      />

      <input
        type="email"
        id="signUpEmail"
        placeholder="Email"
        autocomplete="email"
        required
      />

      <input
        type="password"
        id="signUpPassword"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password"
        minlength="6"
        required
      />

      <button type="submit">Sign up</button>
      <p id="signupMessage" role="status"></p>
    </form>

    <form id="verifyForm" hidden>
      <p>Enter the 6-digit verification code sent to your email.</p>

      <input
        type="text"
        id="verifyCode"
        placeholder="6-digit code"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="one-time-code"
        required
      />

      <button type="submit">Verify email</button>
      <button type="button" id="resendCode">Resend code</button>

      <p id="verifyMessage" role="status"></p>
    </form>

    <p>
      Already have an account?
      <a href="signin.html">Sign in</a>
    </p>

    <script src="signup.js"></script>
  </body>
</html>

</body>
</html>
